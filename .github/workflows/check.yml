name: Verify Cloudflare package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/comptaorion-backend test
      - run: pnpm --filter @workspace/comptaorion-lite run typecheck
      - run: pnpm run check:cloudflare
      - run: pnpm run check:cloudflare:runtime
