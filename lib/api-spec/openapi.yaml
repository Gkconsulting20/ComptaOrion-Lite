        dateNote: { type: string, format: date }
        totalHT: { type: number, exclusiveMinimum: 0 }
        totalTVA: { type: number, minimum: 0 }
        compteAjustementId: { type: integer, minimum: 1 }
        motif: { type: string, minLength: 3, maxLength: 500 }
    SupplierCreditNoteInput:
      type: object
      required: [totalHT, compteAjustementId, motif]
      properties:
        dateNote: { type: string, format: date }
        totalHT: { type: number, exclusiveMinimum: 0 }
        totalTVA: { type: number, minimum: 0 }
        compteAjustementId: { type: integer, minimum: 1 }
        motif: { type: string, minLength: 3, maxLength: 500 }
    AdjustmentAccount:
      type: object
      required: [id, numero, nom]
      properties:
        id: { type: integer }
        numero: { type: string }
        nom: { type: string }
    AdjustmentAccountsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AdjustmentAccount" }
    AccountLedgerResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/AccountLedger" }
    PendingCheck:
      type: object
      additionalProperties: true
    PendingChecksResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: "#/components/schemas/PendingCheck" } }
    LiteBankAccount:
      type: object
      required: [id, nomCompte, soldeActuel, actif]
      properties:
        id: { type: integer }
        nomCompte: { type: string }
        banque: { type: ["string", "null"] }
        soldeActuel: { type: number }
        actif: { type: boolean }
    BankAccountsResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { type: array, items: { $ref: "#/components/schemas/LiteBankAccount" } }

