openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /ai/status:
    get:
      operationId: getAiStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Key presence only, not provider availability
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [configured, model, license]
                    properties:
                      configured: { type: boolean }
                      model: { type: string }
                      license: { type: string }
  /ai/prepare-photo:
    post:
      operationId: preparePhoto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoPreparationInput"
      responses:
        "200":
          description: Uncommitted editable expense draft
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [draftToken, draft, warnings, duplicate, matches, reviewToken]
                    properties:
                      draftToken: { type: string }
                      draft: { $ref: "#/components/schemas/PhotoExpenseDraft" }
                      warnings: { type: array, items: { type: string } }
                      duplicate: { type: boolean }
                      matches: { type: array, items: { $ref: "#/components/schemas/PhotoDuplicateMatch" } }
                      reviewToken: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/AiFailure" }
        "413": { $ref: "#/components/responses/AiFailure" }
        "429": { $ref: "#/components/responses/AiFailure" }
        "502": { $ref: "#/components/responses/AiFailure" }
        "503": { $ref: "#/components/responses/AiFailure" }
  /ai/confirm:
    post:
      operationId: confirmPhotoExpense
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoConfirmationInput"
      responses:
        "200":
          description: Saved expense or identical replay (no second write)
          content:
            application/json:
              schema:
                type: object
                required: [id, entrepriseId, montant, description, dateDepense]
                properties:
                  id: { type: integer }
                  entrepriseId: { type: integer }
                  montant: { type: string }
                  description: { type: string }
                  dateDepense: { type: string }
        "400": { $ref: "#/components/responses/AiFailure" }
        "403": { $ref: "#/components/responses/AiFailure" }
        "409":
          description: Probable duplicates require explicit review; no expense is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoDuplicateConflict"
  /ai/payment-analysis/{clientId}:
    post:
      operationId: analyzeClientPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentAnalysisInput"
      responses:
        "200":
          description: Deterministic indicative payment score, never a credit decision
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/PaymentScore" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
  /fournisseurs:
    get:
      operationId: listSuppliers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Suppliers for the authenticated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppliersResponse"
    post:
      operationId: createSupplier
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierResponse"
        "400": { $ref: "#/components/responses/AiFailure" }
  /achats:
    get:
      operationId: listPurchases
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Supplier invoices and inventory items for the authenticated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasesResponse"
  /achats/lite-create:
    post:
      operationId: createLitePurchase
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LitePurchaseInput"
      responses:
        "201":
          description: Purchase recorded with accounting and stock movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /factures/{id}/paiement:
    post:
      operationId: recordCustomerPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerPaymentInput" }
      responses:
        "201":
          description: Payment and accounting entry recorded atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /factures/{id}/retours:
    post:
      operationId: createCustomerReturn
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoodsReturnInput" }
      responses:
        "201":
          description: Customer credit note, stock movements, and journal entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /achats/{id}/paiement:
    post:
      operationId: recordSupplierPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierPaymentInput" }
      responses:
        "201":
          description: Supplier payment and accounting entry recorded atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /achats/{id}/retours:
    post:
      operationId: createSupplierReturn
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoodsReturnInput" }
      responses:
        "201":
          description: Supplier debit note, stock movements, and journal entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /clients/{id}/compte:
    get:
      operationId: getCustomerAccountLedger
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Customer debit and credit statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLedgerResponse" }
        "404": { $ref: "#/components/responses/AiFailure" }
  /fournisseurs/{id}/compte:
    get:
      operationId: getSupplierAccountLedger
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Supplier debit and credit statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLedgerResponse" }
        "404": { $ref: "#/components/responses/AiFailure" }
  /cheques-clients:
    get:
      operationId: listCustomerChecksToDeposit
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Received customer checks that have not been deposited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingChecksResponse" }
  /cheques-clients/{id}/depot:
    post:
      operationId: depositCustomerCheck
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChequeDepositInput" }
      responses:
        "200":
          description: Check deposited to bank without crediting the customer twice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /comptes-bancaires-lite:
    get:
      operationId: listLiteBankAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active bank accounts for check deposits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankAccountsResponse" }
  /comptes-comptables-ajustement:
    get:
      operationId: listAdjustmentAccounts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [client, fournisseur] }
      responses:
        "200":
          description: Income or expense accounts available for an adjustment note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdjustmentAccountsResponse" }
  /clients/{id}/conditions-escompte:
    put:
      operationId: updateCustomerDiscountTerms
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountTermsInput" }
      responses:
        "200":
          description: Customer discount and net due terms updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
  /fournisseurs/{id}/conditions-escompte:
    put:
      operationId: updateSupplierDiscountTerms
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountTermsInput" }
      responses:
        "200":
          description: Supplier discount and net due terms updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
  /factures/{id}/notes-debit:
    post:
      operationId: createCustomerDebitNote
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerDebitNoteInput" }
      responses:
        "201":
          description: Customer debit note, due balance and journal entry recorded without stock movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /achats/{id}/notes-credit:
    post:
      operationId: createSupplierCreditNote
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierCreditNoteInput" }
      responses:
        "201":
          description: Supplier credit note, payable balance and journal entry recorded without stock movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationResponse" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
        "409": { $ref: "#/components/responses/AiFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    AiFailure:
      description: Explicit validation, authorization, quota or provider failure
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              error: { type: string }
  schemas:
    PaymentAnalysisInput:
      type: object
      properties:
        explain: { type: boolean, default: false, description: "Explicitly send anonymous ratios and counts to Groq for explanation" }
    PhotoPreparationInput:
      type: object
      required: [image, consent]
      properties:
        image: { type: string, maxLength: 5592500, description: "JPEG/PNG/WebP base64 data URL, maximum decoded size 4 MiB; processed transiently, never saved" }
        consent: { type: boolean, enum: [true] }
    PhotoConfirmationInput:
      type: object
      required: [draftToken, confirmed, draft]
      properties:
        draftToken: { type: string }
        confirmed: { type: boolean, enum: [true] }
        draft: { $ref: "#/components/schemas/PhotoExpenseDraft" }
        duplicateChoice: { type: string, enum: ["", create-new], description: "Explicitly create a distinct purchase after reviewing matches; never merges or deletes" }
        reviewToken: { type: [string, "null"], description: "Signed review of this draft and current matches; edits or new matches require another review" }
    PhotoDuplicateMatch:
      type: object
      required: [id, description, montant, dateDepense, reference, fournisseur, reasons]
      properties:
        id: { type: integer }
        description: { type: string }
        montant: { type: string }
        dateDepense: { type: string }
        reference: { type: string }
        fournisseur: { type: string }
        reasons: { type: array, items: { type: string, enum: [reference, date, montant, fournisseur] } }
    PhotoDuplicateConflict:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [PHOTO_DUPLICATES] }
        matches: { type: array, items: { $ref: "#/components/schemas/PhotoDuplicateMatch" } }
        reviewToken: { type: [string, "null"] }
    PhotoExpenseDraft:
      type: object
      required: [description, montant, dateDepense, reference, devise]
      properties:
        description: { type: string, maxLength: 500 }
        montant: { type: [number, "null"], exclusiveMinimum: 0, maximum: 999999999999.99 }
        dateDepense: { type: [string, "null"], description: "YYYY-MM-DD; must be valid and present at confirmation" }
        reference: { type: string, maxLength: 120 }
        fournisseur: { type: string, maxLength: 120, description: "Optional visible business name; no contact book is sent to Groq" }
        devise: { type: string, maxLength: 10, description: "Must match company accounting currency at confirmation; no FX conversion" }
    PaymentScore:
      type: object
      required: [score, asOf, invoiceCount, eligibleCount, excludedCount, totalInvoiced, totalPaid, outstanding, overdueAmount, lateInvoiceCount, averageDelayDays, coverage, components, formula, warnings, explanation, explanationError]
      properties:
        score: { type: [integer, "null"], minimum: 0, maximum: 100 }
        asOf: { type: string }
        invoiceCount: { type: integer }
        eligibleCount: { type: integer }
        excludedCount: { type: integer }
        totalInvoiced: { type: number }
        totalPaid: { type: number }
        outstanding: { type: number }
        overdueAmount: { type: number }
        lateInvoiceCount: { type: integer }
        averageDelayDays: { type: number }
        coverage: { type: string, enum: [insuffisante, limitée, établie] }
        components:
          type: object
          required: [repayment, punctuality, delay]
          properties:
            repayment: { type: number, minimum: 0, maximum: 50 }
            punctuality: { type: number, minimum: 0, maximum: 30 }
            delay: { type: number, minimum: 0, maximum: 20 }
        formula: { type: string }
        warnings: { type: array, items: { type: string } }
        explanation: { type: [string, "null"] }
        explanationError: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Supplier:
      type: object
      required: [id, raisonSociale, numeroFournisseur, telephone, email, soldeDu, actif]
      properties:
        id: { type: integer }
        raisonSociale: { type: string }
        numeroFournisseur: { type: ["string", "null"] }
        contactPrincipal: { type: ["string", "null"] }
        telephone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        adresse: { type: ["string", "null"] }
        soldeDu: { type: number }
        actif: { type: boolean }
    SupplierInput:
      type: object
      required: [raisonSociale]
      properties:
        raisonSociale: { type: string, minLength: 1, maxLength: 255 }
        numeroFournisseur: { type: string, maxLength: 50 }
        contactPrincipal: { type: string, maxLength: 255 }
        telephone: { type: string, maxLength: 50 }
        email: { type: string, maxLength: 255 }
        adresse: { type: string }
    SuppliersResponse:
      type: object
      required: [success, count, data]
      properties:
        success: { type: boolean }
        count: { type: integer }
        data: { type: array, items: { $ref: "#/components/schemas/Supplier" } }
    SupplierResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/Supplier" }
    LitePurchaseItemInput:
      type: object
      required: [produitId, quantite, prixUnitaire]
      properties:
        produitId: { type: integer, minimum: 1 }
        quantite: { type: number, exclusiveMinimum: 0 }
        prixUnitaire: { type: number, minimum: 0 }
    LitePurchaseInput:
      type: object
      required: [fournisseurId, dateFacture, items]
      properties:
        fournisseurId: { type: integer, minimum: 1 }
        numeroFactureFournisseur: { type: string, maxLength: 100 }
        dateFacture: { type: string, format: date }
        dateEcheance: { type: ["string", "null"], format: date }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/LitePurchaseItemInput" }
    PurchaseItem:
      type: object
      required: [id, produitId, description, quantite, prixUnitaire, totalLigne]
      properties:
        id: { type: integer }
        produitId: { type: integer }
        description: { type: string }
        quantite: { type: number }
        prixUnitaire: { type: number }
        totalLigne: { type: number }
    PurchaseInvoice:
      type: object
      required: [id, numeroFacture, numeroFactureFournisseur, dateFacture, statut, totalHT, totalTVA, totalTTC, montantPaye, soldeRestant, fournisseur, items]
      properties:
        id: { type: integer }
        numeroFacture: { type: string }
        numeroFactureFournisseur: { type: ["string", "null"] }
        dateFacture: { type: string, format: date }
        statut: { type: string }
        totalHT: { type: number }
        totalTVA: { type: number }
        totalTTC: { type: number }
        montantPaye: { type: number }
        soldeRestant: { type: number }
        fournisseur: { $ref: "#/components/schemas/Supplier" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PurchaseItem" }
    PurchasesResponse:
      type: object
      required: [success, count, data]
      properties:
        success: { type: boolean }
        count: { type: integer }
        data: { type: array, items: { $ref: "#/components/schemas/PurchaseInvoice" } }
    PurchaseResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        data: { $ref: "#/components/schemas/PurchaseInvoice" }
    CustomerPaymentInput:
      type: object
      required: [montant, modePaiement]
      properties:
        montant: { type: number, exclusiveMinimum: 0 }
        modePaiement: { type: string, enum: [especes, virement, mobile_money, carte_bancaire, cheque] }
        datePaiement: { type: string, format: date }
        reference: { type: string, maxLength: 255 }
        compteBancaireId: { type: integer, minimum: 1 }
        numeroCheque: { type: string, maxLength: 100 }
        banqueCheque: { type: string, maxLength: 255 }
        notes: { type: string, maxLength: 2000 }
    SupplierPaymentInput:
      type: object
      required: [montant, modePaiement]
      properties:
        montant: { type: number, exclusiveMinimum: 0 }
        modePaiement: { type: string, enum: [especes, virement, mobile_money, carte_bancaire] }
        datePaiement: { type: string, format: date }
        reference: { type: string, maxLength: 255 }
        compteBancaireId: { type: integer, minimum: 1 }
        notes: { type: string, maxLength: 2000 }
    GoodsReturnItemInput:
      type: object
      required: [itemId, quantite]
      properties:
        itemId: { type: integer, minimum: 1 }
        quantite: { type: number, exclusiveMinimum: 0 }
        reintegrerStock: { type: boolean }
    GoodsReturnInput:
      type: object
      required: [items]
      properties:
        dateRetour: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/GoodsReturnItemInput" }
    ChequeDepositInput:
      type: object
      required: [compteBancaireId]
      properties:
        compteBancaireId: { type: integer, minimum: 1 }
        dateDepot: { type: string, format: date }
    OperationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          additionalProperties: true
    AccountMovement:
      type: object
      required: [date, reference, type, libelle, montant]
      properties:
        date: { type: ["string", "null"] }
        reference: { type: ["string", "null"] }
        type: { type: string, enum: [facture, paiement, retour, note_debit, note_credit, escompte] }
        libelle: { type: string }
        montant: { type: number }
    AccountLedger:
      type: object
      required: [tiers, mouvements, totaux]
      properties:
        tiers: { type: object, additionalProperties: true }
        mouvements:
          type: array
          items: { $ref: "#/components/schemas/AccountMovement" }
        totaux: { $ref: "#/components/schemas/AccountLedgerTotals" }
    AccountLedgerTotals:
      type: object
      required: [factures, paiements, retours, notesDebit, notesCredit, escomptes, solde]
      properties:
        factures: { type: number }
        paiements: { type: number }
        retours: { type: number }
        notesDebit: { type: number }
        notesCredit: { type: number }
        escomptes: { type: number }
        solde: { type: number }
    DiscountTermsInput:
      type: object
      required: [escomptePourcentage, escompteDelaiJours, delaiPaiement]
      properties:
        escomptePourcentage: { type: number, minimum: 0, maximum: 100 }
        escompteDelaiJours: { type: integer, minimum: 0, maximum: 366 }
        delaiPaiement: { type: integer, minimum: 0, maximum: 3660 }
    CustomerDebitNoteInput:
      type: object
      required: [totalHT, compteAjustementId, motif]
