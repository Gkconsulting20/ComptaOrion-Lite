openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /ai/status:
    get:
      operationId: getAiStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Key presence only, not provider availability
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [configured, model, license]
                    properties:
                      configured: { type: boolean }
                      model: { type: string }
                      license: { type: string }
  /ai/prepare-photo:
    post:
      operationId: preparePhoto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoPreparationInput"
      responses:
        "200":
          description: Uncommitted editable expense draft
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [draftToken, draft, warnings, duplicate, matches, reviewToken]
                    properties:
                      draftToken: { type: string }
                      draft: { $ref: "#/components/schemas/PhotoExpenseDraft" }
                      warnings: { type: array, items: { type: string } }
                      duplicate: { type: boolean }
                      matches: { type: array, items: { $ref: "#/components/schemas/PhotoDuplicateMatch" } }
                      reviewToken: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/AiFailure" }
        "413": { $ref: "#/components/responses/AiFailure" }
        "429": { $ref: "#/components/responses/AiFailure" }
        "502": { $ref: "#/components/responses/AiFailure" }
        "503": { $ref: "#/components/responses/AiFailure" }
  /ai/confirm:
    post:
      operationId: confirmPhotoExpense
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoConfirmationInput"
      responses:
        "200":
          description: Saved expense or identical replay (no second write)
          content:
            application/json:
              schema:
                type: object
                required: [id, entrepriseId, montant, description, dateDepense]
                properties:
                  id: { type: integer }
                  entrepriseId: { type: integer }
                  montant: { type: string }
                  description: { type: string }
                  dateDepense: { type: string }
        "400": { $ref: "#/components/responses/AiFailure" }
        "403": { $ref: "#/components/responses/AiFailure" }
        "409":
          description: Probable duplicates require explicit review; no expense is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoDuplicateConflict"
  /ai/payment-analysis/{clientId}:
    post:
      operationId: analyzeClientPayments
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentAnalysisInput"
      responses:
        "200":
          description: Deterministic indicative payment score, never a credit decision
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/PaymentScore" }
        "400": { $ref: "#/components/responses/AiFailure" }
        "404": { $ref: "#/components/responses/AiFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    AiFailure:
      description: Explicit validation, authorization, quota or provider failure
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
              error: { type: string }
  schemas:
    PaymentAnalysisInput:
      type: object
      properties:
        explain: { type: boolean, default: false, description: "Explicitly send anonymous ratios and counts to Groq for explanation" }
    PhotoPreparationInput:
      type: object
      required: [image, consent]
      properties:
        image: { type: string, maxLength: 5592500, description: "JPEG/PNG/WebP base64 data URL, maximum decoded size 4 MiB; processed transiently, never saved" }
        consent: { type: boolean, enum: [true] }
    PhotoConfirmationInput:
      type: object
      required: [draftToken, confirmed, draft]
      properties:
        draftToken: { type: string }
        confirmed: { type: boolean, enum: [true] }
        draft: { $ref: "#/components/schemas/PhotoExpenseDraft" }
        duplicateChoice: { type: string, enum: ["", create-new], description: "Explicitly create a distinct purchase after reviewing matches; never merges or deletes" }
        reviewToken: { type: [string, "null"], description: "Signed review of this draft and current matches; edits or new matches require another review" }
    PhotoDuplicateMatch:
      type: object
      required: [id, description, montant, dateDepense, reference, fournisseur, reasons]
      properties:
        id: { type: integer }
        description: { type: string }
        montant: { type: string }
        dateDepense: { type: string }
        reference: { type: string }
        fournisseur: { type: string }
        reasons: { type: array, items: { type: string, enum: [reference, date, montant, fournisseur] } }
    PhotoDuplicateConflict:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [PHOTO_DUPLICATES] }
        matches: { type: array, items: { $ref: "#/components/schemas/PhotoDuplicateMatch" } }
        reviewToken: { type: [string, "null"] }
    PhotoExpenseDraft:
      type: object
      required: [description, montant, dateDepense, reference, devise]
      properties:
        description: { type: string, maxLength: 500 }
        montant: { type: [number, "null"], exclusiveMinimum: 0, maximum: 999999999999.99 }
        dateDepense: { type: [string, "null"], description: "YYYY-MM-DD; must be valid and present at confirmation" }
        reference: { type: string, maxLength: 120 }
        fournisseur: { type: string, maxLength: 120, description: "Optional visible business name; no contact book is sent to Groq" }
        devise: { type: string, maxLength: 10, description: "Must match company accounting currency at confirmation; no FX conversion" }
    PaymentScore:
      type: object
      required: [score, asOf, invoiceCount, eligibleCount, excludedCount, totalInvoiced, totalPaid, outstanding, overdueAmount, lateInvoiceCount, averageDelayDays, coverage, components, formula, warnings, explanation, explanationError]
      properties:
        score: { type: [integer, "null"], minimum: 0, maximum: 100 }
        asOf: { type: string }
        invoiceCount: { type: integer }
        eligibleCount: { type: integer }
        excludedCount: { type: integer }
        totalInvoiced: { type: number }
        totalPaid: { type: number }
        outstanding: { type: number }
        overdueAmount: { type: number }
        lateInvoiceCount: { type: integer }
        averageDelayDays: { type: number }
        coverage: { type: string, enum: [insuffisante, limitée, établie] }
        components:
          type: object
          required: [repayment, punctuality, delay]
          properties:
            repayment: { type: number, minimum: 0, maximum: 50 }
            punctuality: { type: number, minimum: 0, maximum: 30 }
            delay: { type: number, minimum: 0, maximum: 20 }
        formula: { type: string }
        warnings: { type: array, items: { type: string } }
        explanation: { type: [string, "null"] }
        explanationError: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

